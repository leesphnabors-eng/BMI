<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<title>BMI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f5;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:42px;letter-spacing:-2px;margin:12px 0 4px}.sub{color:#6b6b72;margin-bottom:26px}
.card{background:white;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 3px 18px #0000000b}
label{display:block;font-size:14px;font-weight:650;color:#666;margin:0 0 8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{position:relative}
input{width:100%;border:1px solid #dddfe3;border-radius:15px;padding:15px 48px 15px 15px;font-size:20px;outline:none;background:#fafafa}
input:focus{border-color:#111;background:white}.unit{position:absolute;right:14px;top:16px;color:#888;font-size:15px}
button{width:100%;border:0;border-radius:16px;padding:16px;background:#111;color:white;font-size:17px;font-weight:700;margin-top:16px}
.result{text-align:center;padding:28px 16px}.bmi{font-size:68px;line-height:1;font-weight:800;letter-spacing:-3px}.category{font-size:19px;font-weight:700;margin-top:10px}
.scale{height:10px;border-radius:10px;background:linear-gradient(90deg,#5b8def 0 23%,#63c174 23% 50%,#f1c453 50% 67%,#e26d6d 67%);margin:24px 0 8px}
.small{font-size:12px;color:#777;display:flex;justify-content:space-between}.note{font-size:13px;color:#777;line-height:1.45;margin-top:18px}
.history-title{display:flex;justify-content:space-between;align-items:center}.clear{width:auto;background:none;color:#777;padding:4px;margin:0;font-size:13px}
.history-item{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #eee}.history-item:last-child{border:0}
.empty{color:#888;font-size:14px}
</style>
</head>
<body>
<main class="app">
<h1>BMI</h1><div class="sub">A simple, private BMI calculator.</div>
<section class="card">
<div class="row">
<div><label for="feet">HEIGHT</label><div class="field"><input id="feet" type="number" inputmode="decimal" min="1" max="8" placeholder="5"><span class="unit">ft</span></div></div>
<div><label for="inches">&nbsp;</label><div class="field"><input id="inches" type="number" inputmode="decimal" min="0" max="11.99" placeholder="11"><span class="unit">in</span></div></div>
</div>
<div style="margin-top:15px"><label for="weight">WEIGHT</label><div class="field"><input id="weight" type="number" inputmode="decimal" min="1" max="999" placeholder="180"><span class="unit">lb</span></div></div>
<button onclick="calculate()">Calculate BMI</button>
</section>

<section class="card result" id="result" style="display:none">
<div class="bmi" id="bmi">—</div><div class="category" id="category">—</div>
<div class="scale"></div><div class="small"><span>18.5</span><span>25</span><span>30</span><span>40+</span></div>
<div class="note">BMI is a screening measure, not a diagnosis. It does not account for muscle mass, body composition, or other individual factors.</div>
</section>

<section class="card">
<div class="history-title"><strong>Recent results</strong><button class="clear" onclick="clearHistory()">Clear</button></div>
<div id="history" style="margin-top:8px"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
function category(v){return v<18.5?"Underweight":v<25?"Healthy weight":v<30?"Overweight":"Obesity";}
function calculate(){
 const ft=parseFloat($("feet").value)||0, inc=parseFloat($("inches").value)||0, lb=parseFloat($("weight").value)||0;
 const totalIn=ft*12+inc;
 if(!totalIn||!lb){alert("Enter your height and weight.");return;}
 const bmi=lb/(totalIn*totalIn)*703, value=Math.round(bmi*10)/10;
 $("bmi").textContent=value.toFixed(1); $("category").textContent=category(value);
 $("result").style.display="block";
 const history=JSON.parse(localStorage.bmiHistory||"[]");
 history.unshift({bmi:value,weight:lb,date:new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"})});
 localStorage.bmiHistory=JSON.stringify(history.slice(0,10)); render();
}
function render(){
 const h=JSON.parse(localStorage.bmiHistory||"[]");
 $("history").innerHTML=h.length?h.map(x=>`<div class="history-item"><span>${x.date} · ${x.weight} lb</span><strong>${x.bmi}</strong></div>`).join(""):'<div class="empty">Your calculations will appear here.</div>';
}
function clearHistory(){localStorage.removeItem("bmiHistory");render();}
["feet","inches","weight"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")calculate()}));
render();
</script>
</body>
</html>
